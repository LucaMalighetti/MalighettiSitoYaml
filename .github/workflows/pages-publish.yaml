#coppie chiave-valore

on: #gira la pipeline quando pushi sul master
  push:
    branches: [master]

permissions:
  contents: read #il workflow può leggere la repo
  pages: write
  id-token: write

jobs:
  deploy: #Github crea la VM, clona la repo e crea il sito
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4

#Github -> Settings -> Pages -> Branch (da None a master)